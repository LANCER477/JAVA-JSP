$kind: http-request
description: "Перевірка безпеки: позиція існує в базі даних, але належить іншому кошику / користувачу. Повертає 403 Forbidden."
url: "{{host}}/cart?ciid={{ciid_other}}&delta=1"
method: PATCH
headers:
  Authorization: Bearer {{user6}}
queryParams:
  - key: ciid
    value: "{{ciid_other}}"
    description: ID позиції, яка існує в БД, але належить чужому кошику
  - key: delta
    value: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 Forbidden', function () {
          pm.response.to.have.status(403);
      });
      pm.test('Response indicates item belongs to another entity', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(403);
          pm.expect(jsonData.data).to.include('belongs to another entity');
      });
    language: text/javascript
order: 7000
