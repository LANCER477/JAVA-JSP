$kind: http-request
name: 8. PATCH Cart Item - Missing Ciid Parameter [442 Missing Query Parameter]
description: "Помилка валідації: обов'язковий параметр ciid не передано в запиті. Повертає 442 Missing Query Parameter."
url: "{{host}}/cart?delta=1"
method: PATCH
headers:
  Authorization: Bearer {{user6}}
queryParams:
  - key: delta
    value: "1"
    description: Параметр ciid навмисно не передається
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 442 Missing Query Parameter', function () {
          pm.response.to.have.status(442);
      });
      pm.test('Response explains ciid parameter is missing', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(442);
          pm.expect(jsonData.data).to.include('ciid');
      });
    language: text/javascript
order: 9000
