$kind: http-request
name: 4. GET /cart/dropped - Unauthorized (401 Unauthorized)
description: Запит без авторизації повертає 401 Unauthorized
url: "{{host}}/cart/dropped"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Response indicates unauthorized', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(401);
      });
    language: text/javascript
order: 4000
