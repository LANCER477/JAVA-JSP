$kind: http-request
description: "Помилка: передано неіснуючий або помилковий ID версії (404 Not Found)"
url: "{{host}}/cart?pvid=wrong-id"
method: POST
headers:
  Authorization: Bearer {{user6}}
queryParams:
  - key: pvid
    value: wrong-id
    description: Неіснуючий ID
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
      pm.test('Product version was not found', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(404);
      });
    language: text/javascript
order: 6000
