$kind: http-request
description: Спроба отримати кошик без авторизації (401 Unauthorized)
url: "{{host}}/cart"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Response contains Unauthorized error metadata', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.isOk).to.be.false;
          pm.expect(jsonData.status.code).to.eql(401);
          pm.expect(jsonData.meta.serviceName).to.eql("API 'User carts'");
      });
    language: text/javascript
order: 2000
