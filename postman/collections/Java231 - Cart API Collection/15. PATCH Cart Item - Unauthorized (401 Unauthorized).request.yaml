$kind: http-request
description: Спроба оновити кошик без авторизації (401 Unauthorized)
url: "{{host}}/cart?ciid={{ciid}}&delta=1"
method: PATCH
queryParams:
  - key: ciid
    value: "{{ciid}}"
    description: ID позиції у кошику (змінна {{ciid}})
  - key: delta
    value: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Unauthorized response returned', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(401);
      });
    language: text/javascript
order: 15000
