$kind: http-request
description: "Помилка: відсутній або некоректний параметр зміни кількості delta (422 Unprocessable Content)"
url: "{{host}}/cart?ciid={{ciid}}"
method: PATCH
headers:
  Authorization: Bearer {{user6}}
queryParams:
  - key: ciid
    value: "{{ciid}}"
    description: ID позиції у кошику (змінна {{ciid}})
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 422 Unprocessable Content', function () {
          pm.response.to.have.status(422);
      });
      pm.test('Response indicates missing or invalid delta parameter', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(422);
      });
    language: text/javascript
order: 14000
