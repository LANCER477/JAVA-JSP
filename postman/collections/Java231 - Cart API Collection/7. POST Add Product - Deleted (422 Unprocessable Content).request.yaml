$kind: http-request
description: "Помилка: спроба додати видалену версію товару (422 Unprocessable Content)"
url: "{{host}}/cart?pvid=5c2052dc-cd4c-4ac4-8bdd-9719415afa96"
method: POST
headers:
  Authorization: Bearer {{user6}}
queryParams:
  - key: pvid
    value: 5c2052dc-cd4c-4ac4-8bdd-9719415afa96
    description: ID видаленої версії товару
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 422 Unprocessable Content', function () {
          pm.response.to.have.status(422);
      });
      pm.test('Response says product version deleted', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(422);
          pm.expect(jsonData.data).to.eql('Product version deleted');
      });
    language: text/javascript
order: 7000
