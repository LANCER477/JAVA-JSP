$kind: http-request
description: Очищення всього кошика (Drop Cart 200 OK)
url: "{{host}}/cart"
method: DELETE
headers:
  Authorization: Bearer {{user2}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Cart is emptied', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status.code).to.eql(200);
          pm.expect(jsonData.data.cartItems.length).to.eql(0);
      });
    language: text/javascript
order: 17000

